name: build

on:
  push:
    branches-ignore:
      - master
    tags:
      - '*'
  workflow_dispatch:

jobs:
  Web:
    runs-on: [self-hosted, vm]
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test browser authentication client
        run: npm test
      - name: Build project
        run: npm run build
      - name: Archive Web Artifact
        run: tar --zstd -cf web.tar.zst -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: web.tar.zst
          retention-days: 1
  Build:
    needs: Web
    uses: exordos/exordos_ci/.github/workflows/element_build.yml@master
    with:
      artifact-name: web
      artifact-path: .
    secrets:
      PUSH_CFG: ${{ secrets.PUSH_CFG }}
